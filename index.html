<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F4EFE5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171C19" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="有归：家庭收纳登记。物有归处，一查便知。" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="有归" />
    <meta name="application-name" content="有归" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <!--
      iOS 只在「添加到主屏幕」时抓取图标，并会缓存失败结果（之后一直显示文字图标）。
      图标文件名带版本（ios-icon-*），更换图标时改文件名，避免命中 iOS 的旧缓存。
    -->
    <link rel="apple-touch-icon" href="/ios-icon-180.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/ios-icon-152.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/ios-icon-167.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/ios-icon-180.png" />
    <link rel="apple-touch-icon-precomposed" sizes="180x180" href="/ios-icon-180.png" />
    <title>有归 · 家庭收纳</title>
    <style>
      html { -webkit-text-size-adjust: 100%; }
      body { margin: 0; background: #F4EFE5; }
      #boot { display: grid; place-items: center; min-height: 100dvh; }
      #boot img { width: 96px; height: 96px; border-radius: 22px; }
      @media (prefers-color-scheme: dark) { body { background: #171C19; } }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot"><img src="/app-icon.svg" alt="有归" /></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
