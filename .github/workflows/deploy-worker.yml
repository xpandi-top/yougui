name: Deploy sync API (Cloudflare Worker)

# 可选。仓库 Variables 设 DEPLOY_WORKER=true，并配置 Secrets：CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID。
on:
  push:
    branches: [main]
    paths: ['worker/**', 'src/core/sync.ts', 'src/core/types.ts', '.github/workflows/deploy-worker.yml']
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ vars.DEPLOY_WORKER == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx wrangler d1 migrations apply yougui --remote
        env:
          CI: 'true'
      - run: npx wrangler deploy
      - name: Smoke test
        if: ${{ vars.VITE_API_URL != '' }}
        run: curl -fsS "${{ vars.VITE_API_URL }}/v1/health"
