name: Deploy web (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # 项目页默认 /<仓库名>/；用户主页仓库（<user>.github.io）请在仓库 Variables 设 VITE_BASE=/
          VITE_BASE: ${{ vars.VITE_BASE || format('/{0}/', github.event.repository.name) }}
          # 可选：默认云同步地址（你的 Worker），以及标签二维码里的正式网址
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_PUBLIC_URL: ${{ vars.VITE_PUBLIC_URL }}
      - run: node scripts/bundle-budget.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
