let initial=[{id:1,name:'HDMI 2.1 线',icon:'〰️',place:'书房 → 储物柜 → 配件盒 A',q:2},{id:2,name:'AA 电池',icon:'🔋',place:'厨房 → 抽屉 1',q:12},{id:3,name:'旅行背包',icon:'🎒',place:'卧室',q:null,container:true},{id:4,name:'电钻',icon:'🛠️',place:'车库 → 工具柜',q:null}];let items;try{items=JSON.parse(localStorage.getItem('homebase-items'))||initial}catch{items=initial}let page='home',selected=1,place='书房',mode='入库',continuous=false,pending=[],actual={},labelCount=6,sub=false,undoState=null;const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem('homebase-items',JSON.stringify(items))}catch{notify('当前浏览器无法保留数据；刷新后可能恢复样例')}}function snapshot(){undoState=JSON.stringify(items)}function notify(s,undo=false){document.getElementById('toast').innerHTML=`<div class="toast" role="status">${esc(s)}${undo?'<button onclick="restore()">撤销</button>':''}</div>`;clearTimeout(window.tt);window.tt=setTimeout(()=>document.getElementById('toast').innerHTML='',4500)}function restore(){if(undoState){items=JSON.parse(undoState);undoState=null;attachments.forEach(a=>a.links=a.links.filter(k=>!k.startsWith('item:')||items.some(i=>'item:'+i.id===k)));saveAttachments();save();render();notify('已撤销')}}function go(p){page=p;render();window.scrollTo(0,0)}function openItem(id){selected=id;go('detail')}function head(k,t,desc=''){return `<span class="eyebrow">${k}</span><h1>${t}</h1>${desc?`<p class="muted">${desc}</p>`:''}`}function itemRows(arr){return arr.map(i=>`<div class="listitem"><button class="thumb" onclick="openItem(${i.id})" aria-label="查看${esc(i.name)}">${coverFor(i)}</button><div class="info"><h3>${esc(i.name)}</h3><div class="path">${esc(i.place||'未分配位置')}</div></div><button class="plain" onclick="openItem(${i.id})">${i.q===null?'查看':i.q+' 件'} ›</button></div>`).join('')||'<p class="empty">这里还没有物品<br><button onclick="go(\'add\')">添加第一件物品</button></p>'}function nav(){document.getElementById('nav').innerHTML=[['home','home','首页'],['places','places','位置'],['scan','scan','扫码'],['items','items','物品'],['more','more','更多']].map(([p,i,t])=>`<button class="${p===page?'active ':''}${p==='scan'?'scan':''}" onclick="go('${p}')"><b>${iconSvg('ui-'+i)}</b>${t}</button>`).join('')}

function render(){nav();if(page==='home')app.innerHTML=head('一 方 居 所 · 井 然 有 序','物有归处，心有从容。')+`<div class="hero"><span class="badge">我的家 · ${items.length} 条物品记录</span><h2>寻物有径，收纳有序</h2><p>扫一下标签，<br>看见物品，也看见它的归处。</p><button onclick="go('scan')">${iconSvg('ui-scan')}　开始扫码</button><span class="art" aria-hidden="true">归</span></div><div style="margin:20px 0"><input placeholder="搜索物品、房间或容器" aria-label="搜索" onfocus="go('items');document.getElementById('query').focus()"></div><div class="row"><h2>家里的位置</h2><button class="plain" onclick="go('places')">全部 →</button></div><div class="grid">${['书房','厨房'].map((r,i)=>`<button class="room" onclick="place='${r}';go('location')"><span class="icon">${iconSvg(i?'items-cup':'items-book')}</span><span>${r}</span><small>${items.filter(x=>x.place.startsWith(r)).length} 条物品记录　↗</small></button>`).join('')}</div><h2>最近登记</h2>${itemRows([...items].reverse().slice(0,3))}<footer>藏有序　·　居有安</footer>`;
if(page==='items')app.innerHTML=head('FIND YOUR THINGS','它在哪里？')+`<input id="query" placeholder="试试 HDMI、电池或书房" aria-label="搜索物品与位置" oninput="search(this.value)"><div class="row"><h2>全家物品</h2><button onclick="go('add')">${iconSvg('ui-add')} 添加</button></div><div id="results">${itemRows(items)}</div>`;

async function addItem(){let n=document.getElementById('name').value.trim(),w=document.getElementById('where').value.trim()||'未分配位置',t=document.getElementById('track').checked,q=Number(document.getElementById('qty').value),c=document.getElementById('container').checked;if(!n)return notify('请填写物品名称');if(t&&(!Number.isInteger(q)||q<0))return notify('数量须为非负整数');if(items.some(i=>i.name===n)&&!confirm('存在同名物品，仍然创建新的独立记录？'))return;snapshot();let photo=document.getElementById('itemPhoto').files[0];let created={id:Date.now(),name:n,place:w,iconKey:draftIcon,q:t?q:null,container:c};items.push(created);place=w;save();render();document.getElementById('name').focus();notify('已添加 '+n,true);if(photo){try{let a=await attachLocalFile(photo,'Photo',n+' · 封面','',['item:'+created.id]);created.coverAttachment=a.id;save();if(page==='add')render();notify('物品与本地封面已保存，未上传云端')}catch(e){notify('物品已保存；照片失败：'+e.message)}}}

function changeMode(m){if(pending.length)return notify('请先确认或清空已有清单');mode=m;render()}function simulate(kind){if(kind==='room'){if(pending.length)return notify('请先处理清单，再更换位置');place='书房';if(!continuous)go('location');else{render();notify('已设置位置：书房')}return}let i=items.find(x=>x.id===2)||items[0];if(!continuous){openItem(i.id);return}let row=pending.find(x=>x.id===i.id);if(row){if(mode==='盘点'||mode==='移动')return notify('已加入清单，不重复计数');row.n++}else pending.push({id:i.id,name:i.name,n:1});render();notify('已加入待提交清单 · 未保存库存')}

function saveCount(){let rows=items.filter(i=>actual[i.id]!==undefined&&actual[i.id]!=='');if(rows.some(i=>!Number.isInteger(Number(actual[i.id]))||Number(actual[i.id])<0))return notify('实际数量须为非负整数');snapshot();rows.forEach(i=>i.q=Number(actual[i.id]));actual={};save();go('count');notify('已保存盘点调整',true)}function manual(){let c=document.getElementById('code').value.trim();if(c==='QR-0025')go('bind');else if(c==='012345678905')simulate('item');else{go('items');document.getElementById('query').value=c;search(c)}}function previewLabels(){let n=Number(document.getElementById('labelqty').value);if(!Number.isInteger(n)||n<1||n>50)return notify('请输入 1–50 的整数');labelCount=n;go('print')}

function chooseChecks(chosen){return targets().map(t=>`<label class="targetoption"><input type="checkbox" name="attachmentTarget" value="${esc(t.key)}" ${chosen.includes(t.key)?'checked':''}><span>${esc(t.name)}<small class="path">${esc(t.path)}</small></span></label>`).join('')}
function chosenTargets(){return Array.from(document.querySelectorAll('input[name="attachmentTarget"]:checked')).map(x=>x.value)}
function renderAttachments(){
if(page==='archive'){let list=archiveAll?attachments:attachments.filter(a=>a.links.length===0);app.innerHTML=head(archiveAll?'DIGITAL ARCHIVE · P1':'UNLINKED FILES · P0',archiveAll?'家有档案，纸有归处。':'先存下，稍后关联。',archiveAll?'数字档案库设计预览 · 文件可先保存，再慢慢整理。':'未关联附件基础入口 · 首版即可独立保存文件。')+`<div class="row"><span class="badge">${archiveAll?'P1 设计预览':'P0 基础能力'} · ${list.length} 份附件</span><button class="primary" onclick="attachmentBack='archive';go('attachmentAdd')">${iconSvg('ui-add')} 添加</button></div>${archiveAll?`<div style="margin:18px 0"><input id="archiveQuery" placeholder="按附件名称搜索" aria-label="搜索附件" oninput="filterArchive()"><select id="archiveType" aria-label="附件类型筛选" style="margin-top:10px" onchange="filterArchive()"><option value="">全部类型</option>${Object.entries(attachmentTypes).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div>`:''}<div id="archiveResults" class="card" style="margin-top:18px">${attachmentRows(list)}</div><div class="notice">本地演示：不会上传文件。所选文件仅在本次页面会话中可预览，刷新后需重新选择；元数据与关联保存在当前浏览器。</div>`}
if(page==='attachmentAdd'){let checks=attachmentBack==='detail'?['item:'+selected]:[];app.innerHTML=head('ADD TO YOUR ARCHIVE','把纸上的，也收好。','物品可以稍后关联，此刻先留下凭证。')+`<div class="segment"><button class="${attachmentMethod==='file'?'sel':''}" onclick="addAttachmentEntry('file')">选择文件</button><button class="${attachmentMethod==='camera'?'sel':''}" onclick="addAttachmentEntry('camera')">拍照</button><button class="${attachmentMethod==='link'?'sel':''}" onclick="addAttachmentEntry('link')">外部链接</button></div><form onsubmit="event.preventDefault();submitAttachment()"><label for="attachmentName">附件名称 *</label><input id="attachmentName" required placeholder="例如：空气净化器购买凭证">${attachmentMethod==='link'?'<label for="attachmentUrl">资源地址 *</label><input id="attachmentUrl" type="url" required placeholder="https://…">':`<label for="attachmentFile">${attachmentMethod==='camera'?'拍照或选择照片':'选择照片 / PDF'} *</label><input id="attachmentFile" type="file" required accept="${attachmentMethod==='camera'?'image/*':'.jpg,.jpeg,.png,.webp,.heic,.heif,.pdf'}" ${attachmentMethod==='camera'?'capture="environment"':''} onchange="fillAttachmentName(this)">`}<label for="attachmentType">类型</label><select id="attachmentType" onchange="updateFilePolicy()">${Object.entries(attachmentTypes).map(([k,v])=>`<option value="${k}" ${k===(attachmentMethod==='link'?'Link':attachmentMethod==='camera'?'Photo':'Document')?'selected':''}>${v}</option>`).join('')}</select><label for="attachmentNote">备注（可选）</label><textarea id="attachmentNote" placeholder="保留一些日后用得上的信息" rows="2"></textarea><div class="notice" id="filePolicy">${attachmentMethod==='link'?'仅保存外部引用，资源权限由来源网站管理。':'文档与凭证保留原件。照片类型保存优化图，不另外保留原图。'}</div><details><summary>关联对象（可选，可多选）</summary>${chooseChecks(checks)}</details><div class="notice">原型仅保存本地元数据；文件在当前会话预览，不上传 R2。</div><p id="uploadStatus" role="status" class="muted"></p><button id="attachmentSubmit" type="submit" class="primary" style="width:100%">保存到本地演示</button></form>`}
if(page==='attachmentDetail'){let a=currentAttachment();if(!a){app.innerHTML=head('NOT FOUND','这份附件已移除。')+'<button onclick="openArchive(false)">返回未关联附件</button>';return}let external=a.provider==='external_url';let available=filesInSession.has(a.id),photo=available&&a.mime?.startsWith('image/');app.innerHTML=head('ATTACHMENT DETAILS',esc(a.name))+`<div class="row"><span class="badge">${attachmentTypes[a.type]||'文档'}</span><span class="muted">${external?'外部引用':a.sample?'样例预览':'本次会话文件'}</span></div><div class="document-preview">${photo?`<img src="${esc(previewUrls.get(a.id))}" alt="${esc(a.name)}">`:`<div class="document-emblem">${iconSvg(external?'ui-link':'ui-file')}</div><h3>${esc(a.original||new URL(a.url).hostname)}</h3><small>${external?'资源来自外部网站':formatBytes(a.size)}</small>`}</div><div class="actions">${external?`<a class="linkbutton primary" href="${esc(safeExternal(a.url)||'#')}" target="_blank" rel="noopener noreferrer">打开外部资源 ↗</a>`:`<button class="primary" onclick="go('attachmentPreview')">预览</button><button onclick="downloadAttachment()" ${!available?'disabled':''}>${iconSvg('ui-download')}下载原型文件</button>`}<button onclick="go('attachmentEdit')">${iconSvg('ui-edit')}编辑</button></div>${!available&&!external?`<div class="notice">${a.sample?'这是设计样例，未附真实文件。预览展示示意文档。':'本次会话文件已失效，请重新添加文件；这里仅保留元数据。'}</div>`:''}<div class="card"><small>备注</small><p>${esc(a.note||'暂无备注')}</p>${a.optimized?'<small>照片已优化 · 原图未另外保留</small>':''}<div class="path">${external?'外部来源':a.sample?'设计样例 · 未上传云端':'浏览器本地 · 未上传云端'}</div></div><div class="row"><h2>关联对象 · ${a.links.length}</h2><button class="plain" onclick="go('attachmentLinks')">管理</button></div><div class="card">${a.links.length?a.links.map(key=>`<div class="linked-object"><div><h3>${esc(targetLabel(key))}</h3><div class="path">${esc(targets().find(t=>t.key===key)?.path||'')}</div></div><button class="plain" onclick="unlinkAttachment('${encodeURIComponent(key)}')">解除关联</button></div>`).join(''):'<p class="muted">独立附件，尚未关联物品。文件仍保留。</p>'}</div>${photo&&a.type==='Photo'&&a.links.includes('item:'+selected)?'<button style="width:100%" onclick="setCover()">设为当前物品封面</button>':''}<button class="danger plain" style="width:100%;margin-top:15px" onclick="deleteAttachment()">${external?'删除附件引用':'删除附件及文件'}</button><p class="muted">删除影响所有关联；外部引用不会删除源网站文件。</p>`}
if(page==='attachmentPreview'){let a=currentAttachment(),file=filesInSession.get(a.id);app.innerHTML=head('DOCUMENT PREVIEW',esc(a.name))+(file?(a.mime?.startsWith('image/')?`<img class="fullpreview" src="${esc(previewUrls.get(a.id))}" alt="${esc(a.name)}">`:a.mime==='application/pdf'?`<iframe title="${esc(a.name)} PDF 预览" src="${esc(previewUrls.get(a.id))}" class="pdfpreview"></iframe><p class="muted">若 Safari 无法内嵌预览，可下载后通过系统文件应用打开。</p>`:'<p class="notice">此格式不支持内嵌预览，请下载原文件。</p>'):a.sample?`<article class="receipt-demo"><span class="eyebrow">样例 · 非真实凭证</span><h2>${esc(a.name)}</h2><hr><p>家庭文件也有自己的归处。</p><p>同一份凭证，可以关联多个物品；<br>解除一个关联，仍保留文件。</p><hr><small>此页仅演示预览版式，不可用作购买或保修凭证。</small></article>`:'<div class="notice">文件已不在当前会话，请重新选择。</div>')+`<button style="width:100%;margin-top:18px" onclick="go('attachmentDetail')">返回附件详情</button>`}
if(page==='attachmentLinks'){let a=currentAttachment();app.innerHTML=head('KEEP THEM CONNECTED','一份文件，几处关联。',esc(a.name))+`<div class="card">${chooseChecks(a.links)}</div><div class="notice">不选任何对象时，附件成为独立文件。保存只改变关联，不删除文件。</div><button class="primary" style="width:100%" onclick="saveAttachmentLinks()">保存关联</button>`}
if(page==='attachmentEdit'){let a=currentAttachment();app.innerHTML=head('EDIT ATTACHMENT','补充档案信息。')+`<form onsubmit="event.preventDefault();editAttachment()"><label for="attachmentName">名称 *</label><input id="attachmentName" required value="${esc(a.name)}"><label for="attachmentType">类型</label><select id="attachmentType">${Object.entries(attachmentTypes).map(([k,v])=>`<option value="${k}" ${a.type===k?'selected':''}>${v}</option>`).join('')}</select><label for="attachmentNote">备注</label><textarea id="attachmentNote" rows="3">${esc(a.note||'')}</textarea>${a.provider==='external_url'?`<label for="attachmentUrl">外部地址</label><input id="attachmentUrl" type="url" required value="${esc(a.url)}">`:''}<p class="notice">编辑类型只改元数据，不改变文件字节；已优化的照片无法通过改类型还原原图。</p><button class="primary" style="width:100%">保存修改</button></form>`}
if(page==='storage')app.innerHTML=head('STORAGE & BACKUP','存得安心，留有备份。','生产架构设计 · 当前原型未连接云端')+`<div class="card"><div class="row"><h3>默认附件存储</h3><span class="badge">P0</span></div><p>Cloudflare R2 · 私有文件</p><small>附件元数据与关联：Cloudflare D1<br>文件访问：经 Worker 验证家庭权限</small></div><div class="card"><h3>本地演示文件</h3><p>${filesInSession.size} 份本次会话文件 · ${attachments.length} 份附件记录</p><small>这不是云端用量。关闭或刷新页面会失去本次会话文件，元数据仍可保留。</small></div><div class="card"><h3>导出与备份 <span class="badge">P1</span></h3><p class="muted">完整 ZIP 将包含物品、位置、附件索引、关联和可导出的 R2 文件。外部资源仅保存引用，不包含源文件。</p><button onclick="downloadLocalIndex()">下载本地演示索引 JSON</button><p class="path">索引不含文件本体，不是完整备份。</p></div><div class="card"><h3>云盘来源</h3><p>Google Drive Picker <span class="badge">P1</span></p><p>OneDrive <span class="badge">P2</span></p><small>尚未连接；不会自动公开私人文件。</small></div>`;
}
function filterArchive(){let q=document.getElementById('archiveQuery').value.toLowerCase(),t=document.getElementById('archiveType').value;document.getElementById('archiveResults').innerHTML=attachmentRows(attachments.filter(a=>a.name.toLowerCase().includes(q)&&(!t||a.type===t)))}
function fillAttachmentName(input){let f=input.files[0];if(f&&!document.getElementById('attachmentName').value)document.getElementById('attachmentName').value=f.name.replace(/\.[^.]+$/,'')}
function updateFilePolicy(){let t=document.getElementById('attachmentType').value;document.getElementById('filePolicy').textContent=attachmentMethod==='link'?'仅保存外部引用，资源权限由来源网站管理。':t==='Photo'?'照片将保存为长边不超过 1600 px 的优化图，不另外保留原图。':'凭证及文档保留原文件，不进行有损压缩。'}
async function prepareFile(file,type){if(file.size>20*1024*1024)throw Error('文件超过 20 MiB，请选择较小文件。');if(!/\.(jpe?g|png|webp|heic|heif|pdf)$/i.test(file.name))throw Error('请选择 JPEG、PNG、WebP、HEIC 或 PDF。');if(file.type&&!['image/jpeg','image/png','image/webp','image/heic','image/heif','application/pdf'].includes(file.type))throw Error('文件实际类型不支持，请重新选择图片或 PDF。');if(type!=='Photo')return {file,mime:file.type||(/\.pdf$/i.test(file.name)?'application/pdf':'application/octet-stream'),optimized:false};if(!/^image\//.test(file.type)&&!/^.*\.(jpe?g|png|webp|heic|heif)$/i.test(file.name))throw Error('照片类型需要图片；PDF 请使用文档或凭证类型。');let src=URL.createObjectURL(file);try{let image=new Image();image.src=src;await image.decode();let factor=Math.min(1,1600/Math.max(image.naturalWidth,image.naturalHeight));let canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.naturalWidth*factor));canvas.height=Math.max(1,Math.round(image.naturalHeight*factor));canvas.getContext('2d').fillStyle='#fff';canvas.getContext('2d').fillRect(0,0,canvas.width,canvas.height);canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);let blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',.84));if(!blob)throw Error();return {file:new File([blob],file.name.replace(/\.[^.]+$/,'.jpg'),{type:'image/jpeg'}),mime:'image/jpeg',optimized:true}}catch{throw Error('此图片暂不能优化。请选择 JPEG/PNG，或以文档类型保留原文件。')}finally{URL.revokeObjectURL(src)}}
async function attachLocalFile(file,type,name,note,links){let result=await prepareFile(file,type);let a={id:Date.now(),name,type,provider:'local_demo',original:file.name,storedName:result.file.name,mime:result.mime,size:result.file.size,sourceSize:file.size,optimized:result.optimized,note,links};attachments.push(a);filesInSession.set(a.id,result.file);previewUrls.set(a.id,URL.createObjectURL(result.file));saveAttachments();return a}
async function submitAttachment(){if(uploadBusy)return;let name=document.getElementById('attachmentName').value.trim(),type=document.getElementById('attachmentType').value,note=document.getElementById('attachmentNote').value.trim(),links=chosenTargets();if(!name)return notify('请填写附件名称');if(attachmentMethod==='link'){let url=safeExternal(document.getElementById('attachmentUrl').value);if(!url)return notify('请输入有效的 http 或 https 链接，不含账户密码');let a={id:Date.now(),name,type,provider:'external_url',url,note,links};attachments.push(a);saveAttachments();openAttachment(a.id);notify('已保存本地链接引用');return}let file=document.getElementById('attachmentFile').files[0];if(!file)return notify('请先选择文件');uploadBusy=true;document.getElementById('attachmentSubmit').disabled=true;document.getElementById('uploadStatus').textContent=type==='Photo'?'正在准备优化图…':'正在准备本地预览，保留原文件…';try{let a=await attachLocalFile(file,type,name,note,links);openAttachment(a.id);notify('已添加本地预览文件 · 未上传云端')}catch(e){notify(e.message);if(document.getElementById('attachmentSubmit')){document.getElementById('attachmentSubmit').disabled=false;document.getElementById('uploadStatus').textContent='保存失败，请修正后重试。'}}finally{uploadBusy=false}}
function saveAttachmentLinks(){let a=currentAttachment();a.links=chosenTargets();clearUnusedCovers(a);saveAttachments();save();go('attachmentDetail');notify('已更新关联，文件仍保留')}
function clearUnusedCovers(a){items.forEach(i=>{if(i.coverAttachment===a.id&&!a.links.includes('item:'+i.id))delete i.coverAttachment})}
function unlinkAttachment(key){let a=currentAttachment();key=decodeURIComponent(key);a.links=a.links.filter(k=>k!==key);clearUnusedCovers(a);saveAttachments();save();render();notify('已解除这条关联，文件仍保留')}
function editAttachment(){let a=currentAttachment(),n=document.getElementById('attachmentName').value.trim();if(!n)return notify('请填写名称');let u=document.getElementById('attachmentUrl');if(u&&!safeExternal(u.value))return notify('请输入有效 http/https 链接');a.name=n;a.type=document.getElementById('attachmentType').value;if(a.type!=='Photo'){items.forEach(i=>{if(i.coverAttachment===a.id)delete i.coverAttachment});save()}a.note=document.getElementById('attachmentNote').value.trim();if(u)a.url=safeExternal(u.value);saveAttachments();go('attachmentDetail');notify('已更新附件信息')}
function deleteAttachment(){let a=currentAttachment();if(!confirm(`删除“${a.name}”？将移除 ${a.links.length} 个关联${a.links.length?'（'+a.links.map(targetLabel).join('、')+'）':''}。\n这会删除本地演示文件或引用，不会删除外部源文件。`))return;items.forEach(i=>{if(i.coverAttachment===a.id)delete i.coverAttachment});let url=previewUrls.get(a.id);if(url)URL.revokeObjectURL(url);filesInSession.delete(a.id);previewUrls.delete(a.id);attachments=attachments.filter(x=>x.id!==a.id);saveAttachments();save();openArchive(false);notify('已删除本地演示附件及关联')}
function downloadBlob(blob,name){let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function downloadAttachment(){let a=currentAttachment(),f=filesInSession.get(a.id);if(!f)return notify('文件已不在本次会话，无法下载');downloadBlob(f,a.storedName||a.original)}
function setCover(){let a=currentAttachment(),i=items.find(i=>i.id===selected);if(!i||a.type!=='Photo'||!a.links.includes('item:'+i.id))return notify('请先关联到当前物品');i.coverAttachment=a.id;save();notify('已设为当前物品封面');go('detail')}

function iconSvg(id,extra=''){let a=ICONS[id]||ICONS['items-box'];return `<svg class="glyph ${extra}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">${a.body}</svg>`}

let draftIcon='items-box',pendingIcon='items-box',iconSearch='',iconGroup='';
function resolvedIcon(i){return ICONS[i.iconKey]?i.iconKey:({'HDMI 2.1 线':'items-cable','AA 电池':'items-battery','旅行背包':'items-backpack','电钻':'items-drill'}[i.name]||'items-box')}
function pickerChoices(context){let arr=Object.entries(ICONS).filter(([k,v])=>k.startsWith('items-')&&(!iconGroup||v.group===iconGroup)&&(!iconSearch||v.name.includes(iconSearch)||v.group.includes(iconSearch)));let chosen=context==='add'?draftIcon:pendingIcon;return `<div class="icon-choice-grid">${arr.map(([k,v])=>`<button type="button" class="icon-choice ${k===chosen?'chosen':''}" aria-pressed="${k===chosen}" aria-label="选择${v.name}图标" onclick="pickIcon('${k}','${context}')">${iconSvg(k)}<small>${v.name}</small></button>`).join('')}</div>${arr.length?'':'<p class="empty">没有匹配图标，请换个关键词。</p>'}`}
function pickerTools(context){let groups=[...new Set(Object.entries(ICONS).filter(([k])=>k.startsWith('items-')).map(([,v])=>v.group))];return `<div class="picker-tools"><input placeholder="搜索图标或类别" aria-label="搜索图标" value="${esc(iconSearch)}" oninput="iconSearch=this.value;refreshPicker('${context}')"><select aria-label="图标类别" onchange="iconGroup=this.value;refreshPicker('${context}')"><option value="">全部类别</option>${groups.map(g=>`<option ${g===iconGroup?'selected':''}>${g}</option>`).join('')}</select></div>`}
function inlineIconPicker(){return `<label>物品图标（可选）</label><div class="icon-current"><span id="draftIconPreview">${iconSvg(draftIcon)}</span><span id="draftIconName">${ICONS[draftIcon].name}</span><small>无照片时显示</small></div><details><summary>选择一个小图标 · 48 款</summary>${pickerTools('add')}<div id="iconChoices">${pickerChoices('add')}</div></details>`}
function openIconPicker(){let i=items.find(x=>x.id===selected);pendingIcon=resolvedIcon(i);iconSearch='';iconGroup='';go('iconPicker')}
function refreshPicker(context){document.getElementById('iconChoices').innerHTML=pickerChoices(context)}
function pickIcon(key,context){if(!ICONS[key]||!key.startsWith('items-'))return;if(context==='add'){draftIcon=key;document.getElementById('draftIconPreview').innerHTML=iconSvg(key);document.getElementById('draftIconName').textContent=ICONS[key].name}else{pendingIcon=key;document.getElementById('pendingIconPreview').innerHTML=iconSvg(key);document.getElementById('pendingIconName').textContent=ICONS[key].name}refreshPicker(context)}
function saveItemIcon(){let i=items.find(x=>x.id===selected);if(!i)return;snapshot();i.iconKey=pendingIcon;save();go('detail');notify('已保存物品图标；照片仍优先显示',true)}
function removeCover(){let i=items.find(x=>x.id===selected);snapshot();delete i.coverAttachment;save();render();notify('已使用所选图标，照片附件仍保留',true)}
function renderIconPicker(){if(page!=='iconPicker')return;app.innerHTML=head('AN ICON FOR EVERY THING','无照片，也一眼认得。','图标只作为识别标记，不改变分类或容器设置。')+`<div class="icon-current"><span id="pendingIconPreview">${iconSvg(pendingIcon)}</span><div><h3 id="pendingIconName">${ICONS[pendingIcon].name}</h3><small>当前选择 · 保存后生效</small></div></div>${pickerTools('detail')}<div id="iconChoices">${pickerChoices('detail')}</div><div class="actions"><button onclick="go('detail')">取消</button><button class="primary" onclick="saveItemIcon()">使用这个图标</button></div>`}

render();
</script></html>
